[package]
name    = "pam_tgbot"
version = "0.1.0"
edition = "2021"

[lib]
name       = "pam_tgbot"
crate-type = ["cdylib"]

[dependencies]
libc         = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
tokio        = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"] }
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
