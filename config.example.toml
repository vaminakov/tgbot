# tgbot configuration — copy to /etc/tgbot/config.toml
# chmod 600 /etc/tgbot/config.toml && chown tgbot:tgbot /etc/tgbot/config.toml

[bot]
# Режим: "webhook" или "polling"
mode = "webhook"
# URL-путь webhook (безопасность через obscurity)
webhook_path = "/secretwebhook"
# Bind: TCP или Unix socket
# bind = "127.0.0.1:8080"
bind = "unix:/run/tgbot/bot.sock"
# Таймаут shell-команд (секунды)
exec_timeout_secs = 30
# IP-фильтр: "telegram" | "disabled" | ["1.2.3.0/24"]
webhook_ip_whitelist = "telegram"
# URL вебхука, который Telegram будет вызывать. Если задан — бот автоматически
# регистрирует (или обновляет) вебхук при старте в режиме webhook.
# Если не задан — управляй вебхуком вручную (make set-webhook).
webhook_address = ""
# true  — всегда вызывать setWebhook при старте (даже если уже зарегистрирован)
# false — проверить getWebhookInfo и вызвать setWebhook только при необходимости
always_set_webhook = false
# Уведомить суперадмина, если при старте обнаружена ошибка вебхука
notify_on_webhook_error = true
# Язык интерфейса: "ru", "en" или "auto" (определяется из LANG/LC_ALL)
# Interface language: "ru", "en", or "auto" (detected from LANG/LC_ALL env var)
language = "auto"

[telegram]
token = "123456:ABC-DEF-REPLACE-ME"
# Кастомный Telegram API адрес (пусто = api.telegram.org)
api_address = ""
# SOCKS5/HTTP прокси (пусто = не использовать)
# proxy = "socks5://user:pass@host:1080"
proxy = ""
request_timeout_secs = 10
request_retries = 3

[admins]
# Первая запись — super-admin (уведомления + sudo)
"123456789" = "BestAdmin"

[zabbix]
url = "https://monit.example.com/"
user = "zabbix_api"
password = "REPLACE_ME"

[speedtest]
# URL Ookla-совместимого сервера для тестирования скорости.
# Формат: https://<host>:<port>/upload.php
#
# Если оставить пустым — бот автоматически выберет ближайший сервер
# через speedtest.net API (требует доступ к speedtest.net).
#
# Примеры серверов (Россия):
#   server_url = "https://speedtest.selectel.ru:8080/upload.php"   # Selectel
#   server_url = "https://spd.mgts.ru:8080/upload.php"             # МГТС
#   server_url = "https://speedtest.rt.ru:8080/upload.php"         # Ростелеком
#
# Найти ближайший: https://www.speedtest.net/api/js/servers?engine=js&https_functional=true&limit=10
server_url = ""

[monitor]
# Отправлять уведомления super-admin при превышении порогов
enabled = false
# Период проверки (секунды)
interval_secs = 60
# Порог CPU (%), RAM (%), диска /
cpu_warn = 85
ram_warn = 90
disk_warn = 85
# Повторное уведомление если проблема не ушла (секунды)
remind_secs = 1800

[pam]
# Включить PAM-интеграцию (уведомления и/или 2FA).
# Требует установки pam_tgbot.so и настройки /etc/pam.d/.
enabled = false

# Уведомлять суперадмина при открытии сессии
notify_login = true

# Двухфакторная аутентификация через Telegram.
# При включении: после первого фактора (пароль/ключ) суперадмину
# поступает запрос с кнопками «Одобрить» / «Отклонить».
two_factor_enabled = false
two_factor_timeout_secs = 60

# Имя команды из [[commands]] для блокировки IP (пусто — кнопка не показывается)
block_ip_cmd = "ban-cs"

[[commands]]
name = "unban"
cmd = "sudo /usr/bin/fail2ban-client unban {arg1}"
desc = "Разблокировать IP (fail2ban). /unban <IP>"
sudo_check = true

[[commands]]
name = "unban-cs"
cmd = "sudo /usr/bin/cscli decisions delete -i {arg1}"
desc = "Разблокировать IP (CrowdSec). /unban-cs <IP>"
sudo_check = true


[[commands]]
name = "mikrotik"
cmd = "sudo /etc/sh/mikrotik.sh {arg1}"
desc = "MikroTik. Аргументы: update | geoip_on | geoip_off"
sudo_check = true

[[commands]]
name = "snft"
cmd = "sudo /usr/bin/snft {args}"
desc = "SNFT anti-DDoS. /snft -d -f 20"
sudo_check = true

[[commands]]
name = "sudo"
cmd = "{args}"
desc = "Произвольная команда (только super-admin)"
sudo_check = false
